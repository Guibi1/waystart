[package]
name = "waystart"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
evalexpr = "13.1.0"
freedesktop-desktop-entry = { version = "0.8.1", default-features = false }
freedesktop-icons = "0.4.0"
gpui = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland"] }
nmrs = "3.4.1"
nucleo-matcher = "0.3.1"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
toml = { version = "1.1.3", features = [ "serde" ] }
unicode-segmentation = "1.13.3"
xflags = "0.3.2"

[profile.release]
codegen-units = 1
lto = "thin"
